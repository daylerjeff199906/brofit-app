name: brofit
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brofit
      POSTGRES_PASSWORD: brofit_local
      POSTGRES_DB: brofit
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brofit"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
volumes:
  postgres_data:
